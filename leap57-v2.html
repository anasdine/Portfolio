// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)
// Copied omelette starter. Re-running copy_starter_component with this kind overwrites this file with the latest version (page content is unaffected).
/* BEGIN USAGE */
/**
 * <three-d-stage> — 3D object viewer + exporter shell (three.js).
 *
 * The stage owns the whole scene: WebGL renderer, neutral studio lighting
 * with a soft ground shadow, orbit controls (drag to orbit, wheel to zoom,
 * right-drag to pan), a camera auto-framed to the object's bounds, resize
 * handling, and a download toolbar that exports the current object as
 * OBJ + MTL or GLB (binary glTF). FBX cannot be exported in the browser;
 * GLB is the interchange format every modern 3D tool imports.
 *
 * three.js loads through the page's import map. Include this EXACT pinned
 * map in <head>, before any module runs — versions and integrity hashes
 * stay together (same map the "3D object" skill mandates):
 *
 *   <script type="importmap">
 *   {
 *     "imports": {
 *       "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
 *       "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
 *       "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
 *       "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
 *     },
 *     "integrity": {
 *       "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
 *       "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
 *       "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
 *       "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
 *       "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
 *     }
 *   }
 *   <\/script>
 *
 * Usage:
 *   <style>three-d-stage:not(:defined){visibility:hidden}</style>
 *   <three-d-stage name="rocket"></three-d-stage>
 *   <script src="three-d-stage.js"><\/script>
 *   <script type="module">
 *     const stage = document.querySelector('three-d-stage');
 *     const { THREE } = await stage.ready;
 *     const model = new THREE.Group();
 *     // …build the model out of named meshes with named materials —
 *     // the names become the o / usemtl entries in the exported OBJ…
 *     stage.setObject(model);
 *   <\/script>
 *
 * Attributes:
 *   name       — export file basename (default "model")
 *   background — CSS color behind the scene (default a warm paper tone)
 *   autorotate — when present, a slow turntable until the user interacts
 *
 * Model in real-world meters, centered on the origin, y-up — exports
 * inherit the scene's units and orientation. The stage fills its own box;
 * size it with ordinary CSS (default 100vw/100vh page hero).
 *
 * Default setup: neutral studio lighting (hemisphere + key + fill), a
 * soft ground shadow, and NO environment map — so high metalness has
 * nothing to reflect and renders near-black. Cap metalness around
 * 0.3–0.4 and carry a metal look with a brighter base color. The copied
 * file is yours: adjust the lights, shadow, or background in _boot()
 * when the object needs a different look.
 */
/* END USAGE */

(() => {
  const stylesheet = `
    :host {
      position: relative;
      display: block;
      width: 100%;
      height: 100vh;
      background: var(--stage-bg, #f0eee6);
      overflow: hidden;
    }
    canvas { display: block; outline: none; }
    .toolbar {
      position: absolute;
      right: 16px;
      bottom: 16px;
      display: flex;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .toolbar button {
      appearance: none;
      border: 1px solid rgba(20, 20, 19, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: #1a1915;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1;
      padding: 9px 12px;
      cursor: default;
    }
    .toolbar button:hover { background: #fff; }
    .toolbar button:active { transform: translateY(1px); }
    .toolbar button[disabled] { opacity: 0.5; pointer-events: none; }
    .note {
      position: absolute;
      left: 16px;
      bottom: 16px;
      max-width: 60%;
      font: 400 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: rgba(26, 25, 21, 0.55);
      user-select: none;
    }
    .err {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font: 500 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #8a2f20;
      text-align: center;
      white-space: pre-line;
    }
  `;

  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /** Tell the host an export attempt settled — telemetry only. The host
   *  (HTMLViewer) verifies the source and re-reads these fields defensively
   *  before counting; nothing else crosses the frame boundary. Guarded so
   *  telemetry can never break the download path. */
  function notifyExport(format, ok) {
    try {
      window.parent.postMessage(
        { type: 'omelette:notify-3d-export', format: format, ok: ok === true },
        '*'
      );
    } catch (e) {}
  }

  class ThreeDStage extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      const style = document.createElement('style');
      style.textContent = stylesheet;
      root.appendChild(style);
      this._err = document.createElement('div');
      this._err.className = 'err';
      root.appendChild(this._err);
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = 'Drag to orbit · scroll to zoom · right-drag to pan';
      root.appendChild(note);
      this._toolbar = document.createElement('div');
      this._toolbar.className = 'toolbar';
      this._objBtn = document.createElement('button');
      this._objBtn.type = 'button';
      this._objBtn.textContent = 'Download OBJ + MTL';
      this._objBtn.addEventListener('click', () => this._runExport('obj'));
      this._glbBtn = document.createElement('button');
      this._glbBtn.type = 'button';
      this._glbBtn.textContent = 'Download GLB';
      this._glbBtn.addEventListener('click', () => this._runExport('glb'));
      this._toolbar.appendChild(this._objBtn);
      this._toolbar.appendChild(this._glbBtn);
      root.appendChild(this._toolbar);
      this._setButtonsEnabled(false);
      /** Resolves with { THREE } once the scene is live — build the model
       *  in `await stage.ready` so nothing races the library load. */
      this.ready = new Promise((resolve, reject) => {
        this._readyResolve = resolve;
        this._readyReject = reject;
      });
    }

    connectedCallback() {
      if (this._booted) {
        // Re-attached after a removal — resume what disconnected stopped.
        if (this._renderer) {
          this._renderer.setAnimationLoop(this._loop);
          this._ro && this._ro.observe(this);
        }
        return;
      }
      this._booted = true;
      this._boot().catch((err) => {
        this._err.style.display = 'flex';
        this._err.textContent =
          'three.js failed to load.\n' +
          'Check that the pinned <script type="importmap"> from the usage ' +
          'notes is in <head> before any module script.\n\n' +
          String(err && err.message ? err.message : err);
        this._readyReject(err);
      });
    }

    async _boot() {
      const bg = this.getAttribute('background');
      if (bg) this.style.setProperty('--stage-bg', bg);
      const [THREE, controlsMod] = await Promise.all([
        import('three'),
        import('three/addons/controls/OrbitControls.js'),
      ]);
      this._THREE = THREE;
      // preserveDrawingBuffer keeps the last frame readable after
      // compositing (toDataURL / drawImage) — it's what lets the
      // screenshot tools capture the scene instead of a blank canvas.
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      this._renderer = renderer;
      this.shadowRoot.insertBefore(renderer.domElement, this._err);

      const scene = new THREE.Scene();
      this._scene = scene;

      const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 500);
      camera.position.set(3, 2.2, 4);
      this._camera = camera;

      const controls = new controlsMod.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      this._controls = controls;

      // Neutral studio: soft sky/ground wash, a shadow-casting key light,
      // and a dim fill from behind so silhouettes never go black.
      scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c4, 1.0));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(4, 7, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -0.0002;
      this._key = key;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xfff4e6, 0.5);
      fill.position.set(-5, 3, -4);
      scene.add(fill);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.ShadowMaterial({ opacity: 0.18 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      this._ground = ground;
      scene.add(ground);

      this._autorotate = this.hasAttribute('autorotate');
      controls.autoRotate = this._autorotate;
      controls.autoRotateSpeed = 1.2;
      controls.addEventListener('start', () => {
        controls.autoRotate = false;
      });

      const fit = () => {
        const w = this.clientWidth || 1;
        const h = this.clientHeight || 1;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      };
      fit();
      this._ro = new ResizeObserver(fit);
      this._loop = () => {
        controls.update();
        renderer.render(scene, camera);
      };
      // Detached while three.js was fetching? Stay idle — the
      // connectedCallback resume starts the loop and observer on
      // reattach.
      if (this.isConnected) {
        this._ro.observe(this);
        renderer.setAnimationLoop(this._loop);
      }

      this._readyResolve({ THREE });
    }

    disconnectedCallback() {
      // Stop rendering and observing while detached; connectedCallback
      // resumes both. (The renderer itself is kept — a move within the
      // document must not rebuild the scene.)
      if (this._renderer) this._renderer.setAnimationLoop(null);
      if (this._ro) this._ro.disconnect();
    }

    /** Show (and own) the object. Replaces any previous object, enables
     *  shadows on every mesh, rests it on the ground plane, and frames
     *  the camera to its bounds. */
    setObject(object) {
      const THREE = this._THREE;
      if (!THREE) throw new Error('three-d-stage: not ready — await stage.ready first');
      if (this._object) this._scene.remove(this._object);
      this._object = object;
      object.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      const box = new THREE.Box3().setFromObject(object);
      if (!box.isEmpty()) {
        // Rest the object on the ground without moving its origin.
        this._ground.position.y = box.min.y;
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        const dist =
          (sphere.radius / Math.tan((this._camera.fov * Math.PI) / 360)) * 1.35;
        const dir = new THREE.Vector3(1, 0.55, 1.25).normalize();
        this._camera.position
          .copy(sphere.center)
          .add(dir.multiplyScalar(dist));
        this._camera.near = Math.max(dist / 100, 0.01);
        this._camera.far = dist * 100;
        this._camera.updateProjectionMatrix();
        this._controls.target.copy(sphere.center);
        this._controls.update();
        const span = sphere.radius * 3;
        this._key.shadow.camera.left = -span;
        this._key.shadow.camera.right = span;
        this._key.shadow.camera.top = span;
        this._key.shadow.camera.bottom = -span;
        this._key.shadow.camera.updateProjectionMatrix();
      }
      this._scene.add(object);
      this._setButtonsEnabled(true);
    }

    get _basename() {
      return (this.getAttribute('name') || 'model').replace(/[^\w.-]+/g, '_');
    }

    _setButtonsEnabled(on) {
      this._objBtn.disabled = !on;
      this._glbBtn.disabled = !on;
    }

    /** Every mesh and material needs a unique name for o/usemtl lines —
     *  fill in stable fallbacks, and return the unique material list. */
    _nameParts() {
      const mats = [];
      const seen = new Set();
      let meshI = 0;
      let matI = 0;
      this._object.traverse((o) => {
        if (!o.isMesh) return;
        if (!o.name) o.name = 'part_' + meshI;
        meshI += 1;
        const list = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of list) {
          if (!m || mats.includes(m)) continue;
          if (!m.name) {
            m.name = 'mat_' + matI;
            matI += 1;
          }
          while (seen.has(m.name)) {
            m.name = m.name + '_' + matI;
            matI += 1;
          }
          seen.add(m.name);
          mats.push(m);
        }
      });
      return mats;
    }

    /** One export attempt, reported to the host however it settles.
     *  Rethrows so a failure stays visible on the guest console exactly as
     *  before. The no-object early return is not an attempt (the toolbar is
     *  disabled until the model loads) and reports nothing. */
    async _runExport(format) {
      if (!this._object) return;
      try {
        await (format === 'obj' ? this._exportObj() : this._exportGlb());
        notifyExport(format, true);
      } catch (err) {
        notifyExport(format, false);
        throw err;
      }
    }

    async _exportObj() {
      if (!this._object) return;
      const mod = await import('three/addons/exporters/OBJExporter.js');
      const mats = this._nameParts();
      const base = this._basename;
      const obj =
        'mtllib ' + base + '.mtl\n' + new mod.OBJExporter().parse(this._object);
      let mtl = '# Exported by three-d-stage\n';
      for (const m of mats) {
        const c = m.color || { r: 0.8, g: 0.8, b: 0.8 };
        const rough = typeof m.roughness === 'number' ? m.roughness : 0.5;
        const opacity = typeof m.opacity === 'number' ? m.opacity : 1;
        mtl += 'newmtl ' + m.name + '\n';
        mtl +=
          'Kd ' + c.r.toFixed(4) + ' ' + c.g.toFixed(4) + ' ' + c.b.toFixed(4) + '\n';
        mtl += 'Ks 0.2000 0.2000 0.2000\n';
        mtl += 'Ns ' + Math.round((1 - rough) * 200) + '\n';
        mtl += 'd ' + opacity.toFixed(4) + '\n\n';
      }
      download(new Blob([obj], { type: 'text/plain' }), base + '.obj');
      download(new Blob([mtl], { type: 'text/plain' }), base + '.mtl');
    }

    async _exportGlb() {
      if (!this._object) return;
      const mod = await import('three/addons/exporters/GLTFExporter.js');
      this._nameParts();
      const base = this._basename;
      const buf = await new mod.GLTFExporter().parseAsync(this._object, {
        binary: true,
      });
      download(
        new Blob([buf], { type: 'model/gltf-binary' }),
        base + '.glb'
      );
    }
  }

  customElements.define('three-d-stage', ThreeDStage);
})();

</script>
  <script type="module">

// Toutes les cotes viennent de exports/scene.json (45 solides dérivés).
// Repère source : x = largeur, y = profondeur (avant→arrière), z = hauteur, mm.
// Repère three : X = x, Y = z, Z = -y  (y-up, base posée sur y=0).

import * as THREE from 'three';

const S = 0.001;
const CX = 224.5, CY = 139, CZ = -20;

const v = (x, y, z) => new THREE.Vector3((x - CX) * S, (z - CZ) * S, (CY - y) * S);

const M = {};
const mat = (name, p) => { const m = new THREE.MeshStandardMaterial(p); m.name = name; M[name] = m; return m; };
mat('alu_anodise',   { color: 0xb2b8bd, metalness: 0.38, roughness: 0.44 });
mat('alu_ailette',   { color: 0xd6dade, metalness: 0.40, roughness: 0.26 });
mat('acier_zingue',  { color: 0xbfc4c8, metalness: 0.36, roughness: 0.34 });
mat('plastique_noir',{ color: 0x1b1d21, metalness: 0.06, roughness: 0.48 });
mat('plastique_gris',{ color: 0x3c4147, metalness: 0.12, roughness: 0.62 });

mat('pcb_mobo',      { color: 0x25322c, metalness: 0.06, roughness: 0.78 });
mat('noctua_beige',  { color: 0xe3d6c1, metalness: 0.00, roughness: 0.60 });
mat('noctua_brun',   { color: 0x7d5049, metalness: 0.03, roughness: 0.48 });
mat('cuivre',        { color: 0xc07a3e, metalness: 0.40, roughness: 0.32 });
mat('contact_or',    { color: 0xc9a341, metalness: 0.40, roughness: 0.26 });

/* ------------------------------------------------------------------ outils */

function addBox(parent, name, m, x, y, z, dx, dy, dz) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(dx * S, dz * S, dy * S), m);
  mesh.name = name;
  mesh.position.copy(v(x + dx / 2, y + dy / 2, z + dz / 2));
  parent.add(mesh);
  return mesh;
}

// Plaque découpée dans le plan (x,z), extrudée vers l'avant (-y) depuis `y`.
function addPlate(parent, name, m, shape, y, ep, ox = 0, oz = 0) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: ep, bevelEnabled: false, steps: 1, curveSegments: 14 });
  g.scale(S, S, S);
  const mesh = new THREE.Mesh(g, m);
  mesh.name = name;
  mesh.position.copy(v(ox, y + ep, oz));
  parent.add(mesh);
  return mesh;
}

function roundedRect(w, h, r, cx = 0, cy = 0) {
  const s = new THREE.Shape();
  const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2;
  s.moveTo(x0 + r, y0);
  s.lineTo(x1 - r, y0); s.quadraticCurveTo(x1, y0, x1, y0 + r);
  s.lineTo(x1, y1 - r); s.quadraticCurveTo(x1, y1, x1 - r, y1);
  s.lineTo(x0 + r, y1); s.quadraticCurveTo(x0, y1, x0, y1 - r);
  s.lineTo(x0, y0 + r); s.quadraticCurveTo(x0, y0, x0 + r, y0);
  return s;
}

function holeRect(shape, w, h, r, cx, cy) {
  shape.holes.push(new THREE.Path(roundedRect(w, h, r, cx, cy).getPoints(8)));
}

function hole(shape, cx, cy, r) {
  const p = new THREE.Path();
  p.absarc(cx, cy, r, 0, Math.PI * 2, true);
  shape.holes.push(p);
}

function cyl(parent, name, m, r, len, axis, x, y, z, seg = 24) {
  const g = new THREE.CylinderGeometry(r * S, r * S, len * S, seg);
  const mesh = new THREE.Mesh(g, m);
  mesh.name = name;
  if (axis === 'x') mesh.rotation.z = Math.PI / 2;
  if (axis === 'y') mesh.rotation.x = Math.PI / 2;   // profondeur scène
  mesh.position.copy(v(x, y, z));
  parent.add(mesh);
  return mesh;
}

/* -------------------------------------------- profilé V-slot (vraie coupe) */

const _prof = new Map();
function vslotShape(nx, ny) {
  const W = nx * 20, H = ny * 20, hw = W / 2, hh = H / 2;
  const A = 5.6, B = 3.1, D1 = 2.3, D2 = 4.2, T = 5.75, D3 = 6.0;
  const sides = [
    { o: [0, -hh], d: [1, 0], n: [0, 1], len: W, k: nx },
    { o: [hw, 0], d: [0, 1], n: [-1, 0], len: H, k: ny },
    { o: [0, hh], d: [-1, 0], n: [0, -1], len: W, k: nx },
    { o: [-hw, 0], d: [0, -1], n: [1, 0], len: H, k: ny },
  ];
  const pts = [];
  for (const s of sides) {
    const half = s.len / 2;
    const P = (u, w) => pts.push(new THREE.Vector2(
      s.o[0] + s.d[0] * u + s.n[0] * w,
      s.o[1] + s.d[1] * u + s.n[1] * w));
    P(-half, 0);
    for (let i = 0; i < s.k; i++) {
      const c = -half + 20 * i + 10;
      P(c - A, 0); P(c - B, D1); P(c - B, D2); P(c - T, D2); P(c - T, D3);
      P(c + T, D3); P(c + T, D2); P(c + B, D2); P(c + B, D1); P(c + A, 0);
    }
  }
  const shape = new THREE.Shape(pts);
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++)
    hole(shape, (i + 0.5) * 20 - W / 2, (j + 0.5) * 20 - H / 2, 2.1);
  return shape;
}

function profileGeom(nx, ny, len) {
  const k = `${nx}:${ny}:${Math.round(len * 10)}`;
  if (!_prof.has(k)) {
    const g = new THREE.ExtrudeGeometry(vslotShape(nx, ny), { depth: len, bevelEnabled: false, steps: 1, curveSegments: 8 });
    g.translate(0, 0, -len / 2);
    g.scale(S, S, S);
    _prof.set(k, g);
  }
  return _prof.get(k);
}

// axe : 'z' (montant), 'x' (traverse largeur), 'y' (traverse profondeur)
function addProfile(parent, name, box, axis) {
  const { x, y, z, dx, dy, dz } = box;
  let nx, ny, len;
  if (axis === 'z') { nx = dx / 20; ny = dy / 20; len = dz; }
  else if (axis === 'y') { nx = dx / 20; ny = dz / 20; len = dy; }
  else { nx = dz / 20; ny = dy / 20; len = dx; }
  const mesh = new THREE.Mesh(profileGeom(Math.round(nx), Math.round(ny), len), M.alu_anodise);
  mesh.name = name;
  if (axis === 'z') mesh.rotation.x = -Math.PI / 2;
  if (axis === 'x') mesh.rotation.y = Math.PI / 2;
  mesh.position.copy(v(x + dx / 2, y + dy / 2, z + dz / 2));
  parent.add(mesh);
  return mesh;
}

function addDiagonal(parent, name, box) {
  const { x, y, z, dx, dy, dz } = box;
  const len = Math.hypot(dy, dz);
  const mesh = new THREE.Mesh(profileGeom(Math.round(dx / 20), 1, len), M.alu_anodise);
  mesh.name = name;
  const a = v(x + dx / 2, y, z), b = v(x + dx / 2, y + dy, z + dz);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), b.clone().sub(a).normalize());
  mesh.position.copy(a.clone().add(b).multiplyScalar(0.5));
  parent.add(mesh);
  return mesh;
}

/* --------------------------------------------------------------- ventilateur */

function bladeShape(len, c0, c1) {
  const s = new THREE.Shape();
  s.moveTo(0, -c0 / 2);
  s.quadraticCurveTo(len * 0.55, -c1 * 0.62, len, -c1 / 2);
  s.quadraticCurveTo(len * 1.03, 0, len, c1 / 2);
  s.quadraticCurveTo(len * 0.5, c1 * 0.3, 0, c0 / 2);
  s.closePath();
  return s;
}

// Ventilateur axial : pousse l'air vers son -Z local (côté bras/moteur = refoulement).
const ROTORS = [];
function buildFan({ name, size, thick, blades = 9, framed = true, frameMat = M.noctua_beige, bladeMat = M.noctua_brun, tours = 1.25 }) {
  const g = new THREE.Group();
  g.name = name;
  const rOut = size * 0.475, rHub = size * 0.16, rTip = rOut - size * 0.012;

  if (framed) {
    const sh = roundedRect(size, size, size * 0.06);
    hole(sh, 0, 0, rOut);
    const b = size / 2 - size * 0.043;
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) hole(sh, sx * b, sy * b, size * 0.019);
    const fg = new THREE.ExtrudeGeometry(sh, { depth: thick, bevelEnabled: false, curveSegments: 10 });
    fg.translate(0, 0, -thick / 2); fg.scale(S, S, S);
    const frame = new THREE.Mesh(fg, frameMat); frame.name = name + ' cadre';
    g.add(frame);
    // bras arrière + moyeu stator
    for (let i = 0; i < 5; i++) {
      const arm = new THREE.Mesh(new THREE.BoxGeometry((rOut - rHub) * S, 3.2 * S, 6 * S), frameMat);
      arm.name = name + ' bras';
      arm.position.set(Math.cos(i * 1.2566) * (rHub + (rOut - rHub) / 2) * S, Math.sin(i * 1.2566) * (rHub + (rOut - rHub) / 2) * S, (-thick / 2 + 4) * S);
      arm.rotation.z = i * 1.2566;
      g.add(arm);
    }
  }
  const rotor = new THREE.Group(); rotor.name = name + ' rotor';
  g.add(rotor);
  ROTORS.push({ rotor, w: tours * Math.PI * 2 });
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(rHub * S, rHub * S, thick * 0.62 * S, 28), bladeMat);
  hub.name = name + ' moyeu'; hub.rotation.x = Math.PI / 2; hub.position.z = thick * 0.06 * S;
  rotor.add(hub);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(rHub * 0.55 * S, rHub * 0.62 * S, 2 * S, 20), M.plastique_noir);
  cap.name = name + ' cache'; cap.rotation.x = Math.PI / 2; cap.position.z = (thick * 0.31 + 1) * S;
  rotor.add(cap);

  const bl = new THREE.ExtrudeGeometry(bladeShape(rTip - rHub + 1, size * 0.13, size * 0.30), { depth: 1.4, bevelEnabled: false, curveSegments: 8 });
  bl.translate(0, 0, -0.7); bl.scale(S, S, S);
  for (let i = 0; i < blades; i++) {
    const pivot = new THREE.Group();
    pivot.rotation.z = (i / blades) * Math.PI * 2;
    const b = new THREE.Mesh(bl, bladeMat);
    b.name = name + ' pale';
    b.position.x = (rHub - 0.5) * S;
    b.rotation.x = -0.62;
    b.rotation.z = 0.22;
    pivot.add(b);
    rotor.add(pivot);
  }
  return g;
}

// pose un ventilateur : 'y' = refoulement vers l'arrière, 'z' = refoulement vers le haut
function placeFan(parent, fan, axis, cx, cy, cz) {
  fan.position.copy(v(cx, cy, cz));
  if (axis === 'z') fan.rotation.x = Math.PI / 2;
  parent.add(fan);
  return fan;
}

/* --------------------------------------------------------------- flux d'air */

function addArrow(parent, name, m, a, b, r) {
  const p0 = v(...a), p1 = v(...b);
  const dir = p1.clone().sub(p0), len = dir.length();
  dir.normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  const head = Math.min(len * 0.4, r * S * 7), shaft = len - head;
  const s = new THREE.Mesh(new THREE.CylinderGeometry(r * S, r * S, shaft, 14), m);
  s.name = name; s.quaternion.copy(q);
  s.position.copy(p0).addScaledVector(dir, shaft / 2);
  const h = new THREE.Mesh(new THREE.ConeGeometry(r * 2.3 * S, head, 18), m);
  h.name = name + ' pointe'; h.quaternion.copy(q);
  h.position.copy(p0).addScaledVector(dir, shaft + head / 2);
  parent.add(s, h);
}

let SMOKE = null;
function fumeeTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d').createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.32)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  const x = c.getContext('2d'); x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); return t;
}

function buildSmoke() {
  const g = new THREE.Group(); g.name = 'Fumée';
  const curves = FLUX.map(f => new THREE.CatmullRomCurve3(f.p.map(p => v(...p)), false, 'catmullrom', 0.4));
  const N = 1600, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const froid = new THREE.Color(0x63a6d8), chaud = new THREE.Color(0xd07f4e);
  const parts = [];
  const jitter = () => new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5)
    .multiplyScalar(Math.sqrt(Math.random()) * 0.09);
  for (let i = 0; i < N; i++) {
    const k = i % curves.length;
    parts.push({ k, t: Math.random(), s: 0.17 + Math.random() * 0.17, o: jitter() });
    const c = FLUX[k].c ? chaud : froid;
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.026, map: fumeeTexture(), vertexColors: true, transparent: true,
    opacity: 0.55, depthWrite: false, sizeAttenuation: true,
  }));
  pts.name = 'Particules de fumée';
  g.add(pts);
  SMOKE = { parts, curves, geo, tmp: new THREE.Vector3() };
  updateSmoke(0);
  return g;
}

function updateSmoke(dt) {
  if (!SMOKE) return;
  const d = (dt > 0 && dt < 0.2) ? dt : 0.016;
  const { parts, curves, geo, tmp } = SMOKE;
  const a = geo.attributes.position;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.t += p.s * d;
    if (!(p.t >= 0 && p.t <= 1)) {
      p.t = Math.random() * 0.04;
      p.o.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(Math.sqrt(Math.random()) * 0.09);
    }
    curves[p.k].getPoint(p.t, tmp);
    a.setXYZ(i, tmp.x + p.o.x, tmp.y + p.o.y, tmp.z + p.o.z);
  }
  a.needsUpdate = true;
}

/* ---------------------------------------------------------------------- GPU */

function buildGPU({ name, x, y, z, dx, dy, dz, nFans, capot }) {
  const g = new THREE.Group(); g.name = name;
  const mCapot = capot || M.capot_tuf;
  const fanPitch = dx / nFans;
  const rFan = Math.min((dz - 26) / 2, fanPitch / 2 - 4);
  const cz = z + dz / 2;

  // capot avant ajouré
  const sh = roundedRect(dx, dz, 7, x + dx / 2, cz);
  for (let i = 0; i < nFans; i++) hole(sh, x + fanPitch * (i + 0.5), cz, rFan);
  addPlate(g, name + ' capot', mCapot, sh, y + 9, 9);

  // liserés de capot (trim clair)
  addBox(g, name + ' liseré haut', M.acier_zingue, x + 6, y + 1, z + dz - 5, dx - 12, 8, 4);
  addBox(g, name + ' liseré bas', M.acier_zingue, x + 6, y + 1, z + 1, dx - 12, 8, 4);
  for (let i = 1; i < nFans; i++)
    addBox(g, name + ' nervure', M.acier_zingue, x + fanPitch * i - 3, y + 1, z + 5, 6, 8, dz - 10);

  // ventilateurs intégrés
  for (let i = 0; i < nFans; i++) {
    const f = buildFan({
      name: `${name} ventilateur ${i + 1}`, size: rFan * 2.02, thick: 22, blades: 11,
      framed: false, bladeMat: M.pale_gpu,
    });
    placeFan(g, f, 'y', x + fanPitch * (i + 0.5), y + 21, cz);
  }

  // bloc ailettes derrière les ventilateurs
  const yF0 = y + 33, yF1 = y + dy - 15;
  addBox(g, name + ' embase ailettes', mCapot, x + 3, yF0, z + 6, dx - 6, yF1 - yF0, dz - 12);
  const nFins = Math.floor((dx - 20) / 11);
  for (let i = 0; i < nFins; i++) {
    addBox(g, name + ' ailette', M.alu_ailette, x + 10 + i * 11, yF0 + 1, z + 8, 1.4, yF1 - yF0 - 2, dz - 16);
  }
  // caloducs affleurant le haut du bloc
  for (let i = 0; i < 4; i++) {
    cyl(g, name + ' caloduc', M.cuivre, 4, dx - 40, 'x', x + dx / 2, yF0 + 8 + i * 7, z + dz - 9);
  }

  // PCB + backplate (le PCB ne fait pas toute la longueur : zone de flux traversant)
  const pcbLen = Math.min(dx - 78, 262);
  const xP = x + dx - pcbLen;
  addBox(g, name + ' PCB', M.pcb_gpu, xP, y + dy - 14, z + 4, pcbLen, 1.8, dz - 20);
  addBox(g, name + ' backplate', mCapot, x + 2, y + dy - 6, z + 3, dx - 4, 6, dz - 6);
  addBox(g, name + ' logo backplate', M.etiquette, x + dx * 0.5, y + dy - 0.6, cz - 9, 46, 0.8, 18);

  // équerre E/S + sorties vidéo
  addBox(g, name + ' équerre', M.acier_zingue, x + dx, y + 3, z + 2, 1.6, 45, dz + 16);
  addBox(g, name + ' patte de vis', M.acier_zingue, x + dx, y + 3, z + dz + 18, 1.6, 20, 14);
  for (let i = 0; i < 4; i++) {
    addBox(g, name + ' sortie vidéo', M.plastique_noir, x + dx - 1, y + 12, z + 22 + i * 26, 4, 20, 9);
  }

  // connecteur 12VHPWR sur l'arête haute

// Nappe plate : largeur constante selon x, chemin dans le plan (y,z).
function buildRibbon(name, pts, width, thick) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => v(p[0], p[1], p[2])), false, 'catmullrom', 0.4);
  const N = 60, w = width * S / 2, t = thick * S / 2;
  const pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const p = curve.getPoint(i / N), tg = curve.getTangent(i / N);
    const nrm = new THREE.Vector3(1, 0, 0).cross(tg).normalize().multiplyScalar(t);
    for (const sx of [-w, w]) for (const sn of [-1, 1]) {
      pos.push(p.x + sx, p.y + nrm.y * sn, p.z + nrm.z * sn);
    }
  }
  // 4 sommets par section : (-w,-n) (-w,+n) (+w,-n) (+w,+n)
  const quad = (a, b, c, d) => idx.push(a, b, c, a, c, d);
  for (let i = 0; i < N; i++) {
    const A = i * 4, B = (i + 1) * 4;
    quad(A + 1, B + 1, B + 3, A + 3);   // face 1
    quad(A + 2, B + 2, B + 0, A + 0);   // face 2
    quad(A + 0, B + 0, B + 1, A + 1);   // chant gauche
    quad(A + 3, B + 3, B + 2, A + 2);   // chant droit
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, M.cable_noir);
  mesh.name = name;
  return mesh;
}

function buildRiser(name, zSlot, cardZ, cardY) {
  const g = new THREE.Group(); g.name = name;
  const xm = 343;                                     // milieu de l'emplacement
  // connecteur mâle dans l'emplacement carte mère

  const pts = [
    [xm, 192, zSlot + 2],

    [xm, 150, cardZ + (zSlot - cardZ) * 0.40],

/* ------------------------------------------------------------------- câble */

function buildCable(name, pts, r = 7) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => v(p[0], p[1], p[2])), false, 'catmullrom', 0.35);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, r * S, 10, false), M.cable_noir);
  mesh.name = name;
  return mesh;
}

         restent ouverts. Montés flottants sur entretoises de 9 mm.        ---- */
  const X = new THREE.Group(); X.name = 'Panneaux plexi'; root.add(X);
  addBox(X, 'Panneau plexi gauche', M.plexi_fume, -9, 8, 14, 4, 293, 806);
  addBox(X, 'Panneau plexi droit', M.plexi_fume, 455, 8, 14, 4, 293, 806);
  addBox(X, 'Panneau plexi arrière (bas)', M.plexi_fume, 8, 315, 14, 433, 4, 26);
  addBox(X, 'Panneau plexi arrière (centre)', M.plexi_fume, 180, 315, 40, 89, 4, 86);
  addBox(X, 'Panneau plexi arrière (haut)', M.plexi_fume, 8, 315, 126, 433, 4, 694);
  for (const z of [46, 788]) {
    for (const y of [22, 297]) {
      cyl(X, 'Entretoise panneau', M.acier_zingue, 6, 9, 'x', -4.5, y, z, 14);
      cyl(X, 'Entretoise panneau', M.acier_zingue, 6, 9, 'x', 453.5, y, z, 14);
    }
    for (const x of [30, 419]) cyl(X, 'Entretoise panneau', M.acier_zingue, 6, 9, 'y', x, 311.5, z, 14);
  }
  addBox(X, 'Plaque gravée LEAP57', M.acier_zingue, -10.6, 44, 44, 1.6, 96, 26);

  /* ---- cloisonnement des deux circuits d'air.
     Les alims sont enfermées au fond : plancher au-dessus, cloison devant,
     rejet direct par l'ouverture arrière du panneau. Leur chaleur ne rentre
     jamais dans la boîte, et l'étage avant peut monter de l'air du sol sans
     jamais croiser une alim.                                             ---- */
  const D = new THREE.Group(); D.name = 'Cloisonnement air froid'; root.add(D);
  addBox(D, 'Plancher baie alim 1', M.tole_tray, 20, 136, 126, 160, 179, 3);
  addBox(D, 'Plancher baie alim 2', M.tole_tray, 269, 136, 126, 160, 179, 3);
  addBox(D, 'Cloison avant baie alim 1', M.tole_tray, 20, 136, 40, 160, 3, 86);
  addBox(D, 'Cloison avant baie alim 2', M.tole_tray, 269, 136, 40, 160, 3, 86);

  /* ---- flux d'air : bleu = air filtré entrant, orange = air chaud extrait.
         Les flèches donnent le SENS DE MONTAGE de chaque ventilateur.   ---- */
  const F = new THREE.Group(); F.name = "Flux d'air"; root.add(F);
  for (const [x, z] of [[174.4, 266], [294.4, 266], [180, 486], [300, 486]])
    addArrow(F, 'Sens admission cartes', M.flux_froid, [x, -105, z], [x, 12, z], 5);
  for (const x of [100, 224.5, 349])
    addArrow(F, "Sens étage d'admission", M.flux_froid, [x, 76, -66], [x, 76, 14], 5);
  for (const y of [66, 190]) for (const x of [100.5, 224.5, 348.5])
    addArrow(F, 'Sens extraction haute', M.flux_chaud, [x, y, 800], [x, y, 900], 5);
  for (const x of [100, 349])
    addArrow(F, 'Aspiration alim', M.flux_froid, [x, 215, -60], [x, 215, 6], 5);

  root.add(buildSmoke());

  /* ---- moniteur : écran 7” + Raspberry Pi sur un rail avant, hors flux ---- */
  const Mo = new THREE.Group(); Mo.name = 'Moniteur Raspberry Pi'; root.add(Mo);
  const mo = buildMoniteur();
  mo.position.copy(v(224.5, 4, 706));
  mo.rotation.x = -0.28;
  Mo.add(mo);
  return root;
}

    const stage = document.querySelector('three-d-stage');
    await stage.ready;
    const model = buildModel();
    stage.setObject(model);

    const liste = document.getElementById('liste');
    for (const g of model.children) {
      const l = document.createElement('label');
      const c = document.createElement('input');
      c.type = 'checkbox'; c.checked = g.visible;
      c.onchange = () => { g.visible = c.checked; };
      l.append(c, document.createTextNode(g.name));
      liste.append(l);
    }
    document.getElementById('ecl').oninput = (e) => {
      const k = +e.target.value;
      for (const g of model.children) g.position.z = (ECART[g.name] || 0) * k;
    };

    const anim = document.getElementById('anim');
    const fumee = model.children.find(g => g.name === 'Fumée');
    let last = performance.now();
    const tick = (t) => {
      const dt = Math.min((t - last) / 1000, 0.1); last = t;
      if (anim.checked) {
        for (const r of ROTORS) r.rotor.rotation.z -= r.w * dt;
        if (fumee.visible) updateSmoke(dt);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  </script>
